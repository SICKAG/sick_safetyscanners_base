include:
  - project: 'continuous_integration/ci_scripts'
    ref: master
    file: '/gitlab-ci-yml/fla_pipeline.yml'

.boost_compatibility:
  stage: test
  before_script:
    - apt-get update
    - apt-get install --yes build-essential cmake libboost-dev libboost-chrono-dev libboost-thread-dev
  script:
    - cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS=-DBOOST_ASIO_NO_DEPRECATED
    - cmake --build build --parallel
    - ctest --test-dir build --output-on-failure

# Ubuntu 22.04 provides Boost 1.74, the oldest version covered by this project.
boost_1_74:
  extends: .boost_compatibility
  image: ubuntu:22.04

# Ubuntu 26.04 provides Boost 1.90.
boost_1_90:
  extends: .boost_compatibility
  image: ubuntu:26.04
